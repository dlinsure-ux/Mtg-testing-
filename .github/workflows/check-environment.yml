
name: Check Java Environment

on:
  workflow_dispatch:

jobs:
  check-java:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify environment
        run: |
          echo "=== JAVA ==="
          java -version
          echo "=== CPU ==="
          nproc
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h .
