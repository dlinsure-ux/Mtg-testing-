name: Commander AI Lab Build Verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commander-ai-lab-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check out Commander AI Lab and matching Forge fork
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/KoalaTrapLord/commander-ai-lab.git lab
          git clone --depth 1 https://github.com/KoalaTrapLord/Forge-Repo.git forge
      - name: Build Forge dependencies
        shell: bash
        run: |
          set -o pipefail
          cd forge
          mvn -B -ntp install -pl forge-gui-desktop -am -DskipTests -Drevision=2.0.12-SNAPSHOT 2>&1 | tee ../forge-build.log
      - name: Build Commander AI Lab
        shell: bash
        run: |
          set -o pipefail
          cd lab
          mvn -B -ntp -DskipTests package 2>&1 | tee ../lab-build.log
      - name: Verify Forge desktop artifact exists
        shell: bash
        run: |
          set -euo pipefail
          find forge/forge-gui-desktop/target -name '*jar-with-dependencies.jar' -print | tee forge-artifacts.log
          test -s forge-artifacts.log
      - name: Verify CLI startup
        shell: bash
        run: |
          set -o pipefail
          java -jar lab/target/commander-ai-lab-1.0.0-SNAPSHOT.jar --help 2>&1 | tee cli-help.log
      - name: Save diagnostic summary in repository
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logs = ['forge-build.log','lab-build.log','cli-help.log','forge-artifacts.log'];
            const sections = logs.map(file => {
              if (!fs.existsSync(file)) return file + ': not generated';
              const lines = fs.readFileSync(file,'utf8').split('\n');
              const errors = lines.filter(line => /ERROR|BUILD FAILURE|Exception|Could not|Failed to|fatal:/i.test(line)).slice(-60);
              return file + '\n' + [...errors,...lines.slice(-25)].join('\n');
            });
            const body = 'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\n\n' + sections.join('\n\n');
            const path = 'diagnostics-summary.txt';
            let sha;
            try {
              const old = await github.rest.repos.getContent({...context.repo,path});
              sha = old.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path, sha,
              message: 'Record Commander AI Lab build diagnostics',
              content: Buffer.from(body).toString('base64')
            });
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-ai-lab-build-evidence
          path: |
            forge-build.log
            lab-build.log
            cli-help.log
            forge-artifacts.log
            lab/target/*.jar
          if-no-files-found: warn
          retention-days: 14
