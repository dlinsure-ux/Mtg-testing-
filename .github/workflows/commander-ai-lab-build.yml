name: Commander AI Lab Build Verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commander-ai-lab-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          java -version
          mvn -version
          echo "Run ID: ${GITHUB_RUN_ID}"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check out Commander AI Lab and matching Forge fork
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/KoalaTrapLord/commander-ai-lab.git lab
          git clone --depth 1 https://github.com/KoalaTrapLord/Forge-Repo.git forge
      - name: Build Forge dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd forge
          mvn -B -ntp install -pl forge-gui-desktop -am -DskipTests -Drevision=2.0.12-SNAPSHOT 2>&1 | tee ../forge-build.log
      - name: Repair installed Forge parent POM version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path.home()/'.m2/repository/forge'
          fixed=[]
          for pom in root.rglob('*.pom'):
              source=pom.read_text()
              if '${revision}' in source:
                  pom.write_text(source.replace('${revision}', '2.0.12-SNAPSHOT'))
                  fixed.append(str(pom))
          print('Repaired Forge POM descriptors:', len(fixed))
          for item in fixed: print(item)
          PY
      - name: Build Commander AI Lab
        shell: bash
        run: |
          set -euo pipefail
          cd lab
          mvn -B -ntp -DskipTests -Drevision=2.0.12-SNAPSHOT package 2>&1 | tee ../lab-build.log
      - name: Verify Forge desktop artifact exists
        shell: bash
        run: |
          set -euo pipefail
          find forge/forge-gui-desktop/target -name '*jar-with-dependencies.jar' -print | tee forge-artifacts.log
          test -s forge-artifacts.log
      - name: Verify CLI startup
        shell: bash
        run: |
          set -euo pipefail
          java -jar lab/target/commander-ai-lab-1.0.0-SNAPSHOT.jar --help 2>&1 | tee cli-help.log
      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
      - name: Probe Forge directly before Lab
        shell: bash
        run: |
          set -uo pipefail
          FORGE_JAR="$(realpath "$(find forge/forge-gui-desktop/target -name '*jar-with-dependencies.jar' -print -quit)")"
          echo "Java: $JAVA_HOME"
          echo "Forge jar: $FORGE_JAR"
          ls -ld forge/forge-gui/res forge/forge-gui 2>&1 || true
          unzip -p "$FORGE_JAR" META-INF/MANIFEST.MF | grep -E '^(Main-Class|Manifest-Version):'
          echo '=== Direct Forge CLI ==='
          rc=0
          timeout 30 xvfb-run -a "$JAVA_HOME/bin/java" -jar "$FORGE_JAR" --help > direct-forge.log 2>&1 || rc=$?
          echo "Direct Forge exit: $rc"
          cat direct-forge.log
          echo '=== JVM crash reports ==='
          find . -name 'hs_err_pid*.log' -print
          exit 0
      - name: Install Commander decks in Forge user library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.forge/decks/commander"
          cp decks/lathiel.dck opponents/deadpool.dck opponents/winota_ultra_budget.dck opponents/shroofus.dck "$HOME/.forge/decks/commander/"
          ls -l "$HOME/.forge/decks/commander/"
      - name: Run one four-player Forge smoke test
        env:
          TEST_RUN_MARKER: lathiel-random-b3-pod-20261013
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p results
          FORGE_JAR="$(realpath "$(find forge/forge-gui-desktop/target -name '*jar-with-dependencies.jar' -print -quit)")"
          test -f decks/lathiel.dck
          test -f opponents/deadpool.dck
          test -f opponents/winota_ultra_budget.dck
          test -f opponents/shroofus.dck
          timeout 600 xvfb-run -a java -jar lab/target/commander-ai-lab-1.0.0-SNAPSHOT.jar \
            --forge-jar "$FORGE_JAR" \
            --java17 "${JAVA_HOME}/bin/java" \
            --forge-dir forge/forge-gui \
            --deck1 "$GITHUB_WORKSPACE/decks/lathiel.dck" \
            --deck2 "$GITHUB_WORKSPACE/opponents/deadpool.dck" \
            --deck3 "$GITHUB_WORKSPACE/opponents/winota_ultra_budget.dck" \
            --deck4 "$GITHUB_WORKSPACE/opponents/shroofus.dck" \
            --games 1 --threads 1 --clock 300 --no-db \
            --output results/smoke-test.json --verbose 2>&1 | tee smoke-test.log
          test -s results/smoke-test.json
          echo '=== Forge subprocess diagnostics ==='
          if [ -f forge/forge-sim-debug.log ]; then cat forge/forge-sim-debug.log; fi
          if grep -Eqi 'Could not load deck|match cannot start|No deck found|Forge exit=[1-9]|Forge produced NO output|Turns: 0|Avg Turns: 0' smoke-test.log forge/forge-sim-debug.log; then
            echo 'FAIL: Forge did not complete a real game' >&2
            exit 1
          fi
          if ! grep -Eq 'Game Result: Game [0-9]+ ended in .*has won!' forge/forge-sim-debug.log; then
            echo 'FAIL: No real Forge game winner recorded' >&2
            exit 1
          fi
          if grep -Eq 'Avg Turns: 0\\.0|Could not resolve deck path' smoke-test.log; then
            echo 'FAIL: No actual gameplay or missing deck files' >&2
            exit 1
          fi
      - name: Save diagnostic summary in repository
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logs = ['forge-build.log','lab-build.log','cli-help.log','forge-artifacts.log','direct-forge.log','smoke-test.log'];
            const sections = logs.map(file => {
              if (!fs.existsSync(file)) return file + ': not generated';
              const lines = fs.readFileSync(file,'utf8').split('\n');
              const errors = lines.filter(line => /ERROR|BUILD FAILURE|Exception|Could not|Failed to|fatal:/i.test(line)).slice(-60);
              return file + '\n' + [...errors,...lines.slice(-25)].join('\n');
            });
            const body = 'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\n\n' + sections.join('\n\n');
            const path = 'diagnostics-summary.txt';
            let sha;
            try {
              const old = await github.rest.repos.getContent({...context.repo,path});
              sha = old.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path, sha,
              message: 'Record Commander AI Lab build diagnostics',
              content: Buffer.from(body).toString('base64')
            });
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-ai-lab-build-evidence
          path: |
            forge-build.log
            lab-build.log
            cli-help.log
            forge-artifacts.log
            smoke-test.log
            direct-forge.log
            forge/forge-sim-debug.log
            results/*.json
            lab/target/*.jar
          if-no-files-found: warn
          retention-days: 14
