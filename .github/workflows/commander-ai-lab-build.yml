# Five-game retry-policy validation, with updated structural preflight checks.
# Diagnostic fix: opt-in wide-board speculative blocking guard (run #143).
# Run #147: type-property LKI fast-path validation after run #146 token-board stall.
name: Commander Forge Test Harness
# Experimental fixed-pod five-game run: Lathiel versus Aesi, Bello and Betor.
# Rionya Fire Dancer: first five-game fixed-pod baseline, no custom Rionya runtime pilot.
on:
  workflow_dispatch:
    inputs:
      deck:
        description: Primary Commander deck path
        required: true
        default: decks/rionya.dck
        type: string
      opponents:
        description: Opponent selection mode
        required: true
        default: random
        type: choice
        options: [fixed, random]
      games:
        description: Number of games
        required: true
        default: '5'
        type: choice
        options: ['1', '5', '10', '20']
permissions:
  contents: write
  issues: write
jobs:
  publish-run-start:
    name: Publish run ID for future chats
    runs-on: ubuntu-latest
    steps:
      - name: Record run ID in dashboard issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/2/comments" -f body="RUN_START workflow=commander-ai-lab-build run_id=$GITHUB_RUN_ID run_number=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || echo "::warning::Run dashboard comment could not be posted"
  preflight:
    name: Validate workflow before expensive build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and offline regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_forge_game.py tests/test_validator_patterns.py scripts/preflight_selected_decks.py scripts/audit_rionya_gameplay.py
          python3 -m unittest discover -s tests -p 'test_validator_patterns.py' -v
          python3 -m unittest discover -s tests -p 'test_patch_lab_winner_parser.py' -v
          python3 -m unittest discover -s tests -p 'test_timeout_ordering.py' -v
          python3 -m unittest discover -s tests -p 'test_speculative_block_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_property_type_lki_fastpath.py' -v
          python3 scripts/check_commander_workflow.py
          python3 -m unittest discover -s tests -p 'test_commander_workflow.py' -v
          python3 -m unittest discover -s tests -p 'test_prepare_commander_game.py' -v
          python3 -m unittest discover -s tests -p 'test_rionya_pilot.py' -v
          python3 -m unittest discover -s tests -p 'test_rionya_audit.py' -v
      - name: Lint workflow and shell scripts
        uses: raven-actions/actionlint@v2
        with:
          flags: -color .github/workflows/commander-ai-lab-build.yml
      - name: Verify cache and build ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/commander-ai-lab-build.yml').read_text()
          names=['Check out Commander AI Lab and matching Forge fork','Cache Maven dependencies after upstream checkout','Build Forge dependencies','Build Commander AI Lab']
          positions=[s.find('name: '+name) for name in names]
          assert all(p>=0 for p in positions) and positions==sorted(positions), 'Build dependency ordering invalid'
          assert not any(line.strip() == ('cache:' + ' maven') for line in s.splitlines()), 'Premature setup-java Maven cache'
          print('Preflight passed')
          PY
  build:
    needs: preflight
    name: Commander deck series
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Resolve primary deck and game count
        shell: bash
        env:
          REQUESTED_DECK: ${{ inputs.deck || 'decks/rionya.dck' }}
          REQUESTED_GAMES: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[five-game]') && '5' || '1') || inputs.games || '5' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          deck=Path(os.environ['REQUESTED_DECK'])
          assert not deck.is_absolute() and '..' not in deck.parts, 'Unsafe deck path'
          assert deck.parts[0]=='decks' and deck.suffix=='.dck' and deck.is_file(), 'Deck must be an existing decks/*.dck file'
          assert os.environ['REQUESTED_GAMES'] in ('1','5','10','20'), 'Unsupported game count'
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('PRIMARY_DECK='+str(deck)+'\n')
              out.write('GAME_COUNT='+os.environ['REQUESTED_GAMES']+'\n')
          print('Deck:',deck,'Games:',os.environ['REQUESTED_GAMES'])
          PY
      - name: Preflight validator compilation and offline tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_forge_game.py tests/test_validator_patterns.py scripts/preflight_selected_decks.py
          python3 scripts/preflight_selected_decks.py "$PRIMARY_DECK" opponents/deadpool.dck opponents/shroofus.dck opponents/winota_ultra_budget.dck
          python3 -m unittest discover -s tests -p 'test_validator_patterns.py' -v
          python3 -m unittest discover -s tests -p 'test_patch_lab_winner_parser.py' -v
          python3 -m unittest discover -s tests -p 'test_timeout_ordering.py' -v
          python3 -m unittest discover -s tests -p 'test_speculative_block_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_property_type_lki_fastpath.py' -v
          python3 scripts/check_commander_workflow.py
          python3 -m unittest discover -s tests -p 'test_commander_workflow.py' -v
          python3 -m unittest discover -s tests -p 'test_prepare_commander_game.py' -v
          python3 -m unittest discover -s tests -p 'test_rionya_pilot.py' -v
      - name: Static workflow analysis
        uses: raven-actions/actionlint@v2
        with:
          flags: -color .github/workflows/commander-ai-lab-build.yml
      - name: Record runner environment
        run: |
          java -version
          mvn -version
          echo "Run ID: ${GITHUB_RUN_ID}"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check out Commander AI Lab and use vendored Forge snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/KoalaTrapLord/commander-ai-lab.git lab
          git -C lab checkout --detach 54cc5e9b2e9ae6266c64b5cdf11f3302f311c701
          python3 scripts/verify_vendored_forge.py
          rm -rf forge
          cp -a vendor/forge forge
          test "$(cat vendor/forge-metadata/upstream-commit.txt)" = "edb28158f6d892f9eb43dc08f019aab567276027"
      - name: Cache Maven dependencies after upstream checkout
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-forge-lab-${{ hashFiles('forge/**/pom.xml', 'lab/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-forge-lab-
      - name: Select opponents for this series
        env:
          OPPONENT_MODE: ${{ inputs.opponents || 'random' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, random
          from pathlib import Path
          pool=sorted(p for p in Path('opponents').glob('*.dck') if p.is_file())
          assert len(pool)>=3, 'At least three opponent decks required'
          # System entropy, not a hand-picked or hardcoded opponent pod.
          # Targeted five-game loading stress test: two previously rejected decks, plus one random third.
          fixed=[Path('opponents/winota_ultra_budget.dck'),Path('opponents/shroofus.dck'),Path('opponents/deadpool.dck')]
          assert all(p in pool for p in fixed), 'Fixed opponents missing'
          mode=os.environ.get('OPPONENT_MODE','random')
          assert mode in ('fixed','random'), 'Invalid opponent mode'
          # Exclude the previous Winota/Shroofus/Deadpool pod from new random series.
          fresh=[p for p in pool if p not in fixed and p.as_posix()!=os.environ.get('PRIMARY_DECK','')]
          assert mode!='random' or len(fresh)>=3, 'Need at least three NEW eligible opponents; refuse old pod fallback'
          selected=random.SystemRandom().sample(fresh,3) if mode=='random' else fixed
          assert mode!='random' or all(p not in fixed for p in selected), 'Old opponent slipped into random pod'
          with open(os.environ['GITHUB_ENV'],'a') as env:
              for i,p in enumerate(selected,2):
                  env.write(f'SEAT_{i}_PATH={p.as_posix()}\n')
          Path('results').mkdir(exist_ok=True)
          Path('results/opponent-selection.json').write_text(json.dumps({
              'selection':mode,
              'pool':[str(p) for p in pool],
              'selected':[str(p) for p in selected]},indent=2)+'\\n')
          print('Selected opponent pod:', ', '.join(map(str,selected)))
          PY
      - name: Preflight selected random opponents
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preflight_selected_decks.py "$PRIMARY_DECK" "$SEAT_2_PATH" "$SEAT_3_PATH" "$SEAT_4_PATH"
      - name: Patch Commander AI Lab alternate-win outcome parsing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_lab_winner_parser.py
          python3 scripts/patch_lab_jvm_compiler.py
          grep -Fq 'cmd.add("-XX:TieredStopAtLevel=4");' lab/src/main/java/commanderailab/batch/BatchRunner.java
          grep -Fq 'cmd.add("-Dforge.ai.speculativeCombatGuard=true");' lab/src/main/java/commanderailab/batch/BatchRunner.java
      - name: Verify Lab winner parser regression
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("lab/src/main/java/commanderailab/batch/BatchRunner.java").read_text()
          assert 'has won (?:because|due to effect of) (.+)' in source
          for line in (
              "Game Outcome: Ai(4)-Betor B3 Exact has won due to effect of 'Felidar Sovereign'",
              "Game Outcome: Ai(2)-Aesi has won because all opponents have lost",
          ):
              assert "Game Outcome: Ai(" in line and " has won " in line and ("has won because " in line or "has won due to effect of " in line)
          print("Both Forge winner reason variants recognized")
          PY
      - name: Install isolated Kwia card compatibility scripts
        shell: bash
        run: |
          set -euo pipefail
          install -D forge-overrides/cardsfolder/k/kwia_vigorbloom.txt forge/forge-gui/res/cardsfolder/k/kwia_vigorbloom.txt
          install -D forge-overrides/tokenscripts/c_a_lotus_kwia.txt forge/forge-gui/res/tokenscripts/c_a_lotus_kwia.txt
          grep -F 'Name:Kwia Vigorbloom' forge/forge-gui/res/cardsfolder/k/kwia_vigorbloom.txt
          grep -F 'Name:Lotus' forge/forge-gui/res/tokenscripts/c_a_lotus_kwia.txt
      - name: Instrument Forge AI decision timeouts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('forge/forge-ai/src/main/java/forge/ai/AiController.java')
          src = p.read_text()
          old = '        } catch (InterruptedException | ExecutionException | TimeoutException e) {'
          assert src.count(old) == 1, 'Upstream AI timeout handler changed; abort instrumentation'
          new = '''        } catch (InterruptedException | ExecutionException | TimeoutException e) {
              if (e instanceof TimeoutException) {
                  System.err.println("AI_DECISION_TIMEOUT player=" + player.getName()
                          + " turn=" + game.getPhaseHandler().getTurn()
                          + " phase=" + game.getPhaseHandler().getPhase()
                          + " budget_seconds=" + game.getAITimeout()
                          + " candidates=" + all.size());
                  // Capture the exact slow evaluation stack before upstream
                  // forcibly stops the worker thread. No overhead on success.
                  for (StackTraceElement frame : t.getStackTrace()) {
                      System.err.println("AI_TIMEOUT_STACK " + frame);
                  }
              }'''
          # Use only known upstream types; no gameplay changes.
          p.write_text(src.replace(old, new))
          print('Instrumented AI timeout context in isolated Forge checkout')
          PY
      - name: Reduce allocations in Forge combat prediction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('forge/forge-ai/src/main/java/forge/ai/AiAttackController.java')
          s=p.read_text()
          old='final List<Card> attackerList = new ArrayList<>(attackers);'
          assert s.count(old)==1
          s=s.replace(old, 'final List<Card> attackerList = attackers;')
          p.write_text(s)
          print('Removed redundant combat prediction list allocation')
          PY
      - name: Fast-path hypothetical combat with no available blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('forge/forge-ai/src/main/java/forge/ai/ComputerUtilCard.java')
          s=p.read_text()
          old='''        final List<Card> attackers = Lists.newArrayList(attacker);
                  aiBlk.assignBlockersGivenAttackers(combat, attackers);'''
          new='''        // Skip the expensive hypothetical blocker AI only when the defending
                  // battlefield contains no creatures at all. This conservative
                  // case cannot remove any existing legal blocker.
                  boolean defenderHasCreature = false;
                  for (Player opponent : ai.getOpponents()) {
                      for (Card candidate : opponent.getCardsIn(ZoneType.Battlefield)) {
                          if (candidate.isCreature()) {
                              defenderHasCreature = true;
                              break;
                          }
                      }
                      if (defenderHasCreature) {
                          break;
                      }
                  }
                  if (!defenderHasCreature) {
                      return false;
                  }
                  final List<Card> attackers = Lists.newArrayList(attacker);
                  aiBlk.assignBlockersGivenAttackers(combat, attackers);'''
          assert s.count(old)==1, 'Pinned Forge hypothetical combat method changed'
          p.write_text(s.replace(old,new))
          assert new in p.read_text()
          print('Installed conservative no-creatures blocker simulation fast path')
          PY
      - name: Bound speculative pump combat evaluation on crowded boards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('forge/forge-ai/src/main/java/forge/ai/ComputerUtilCard.java')
          s=p.read_text()
          old='if (!doesCreatureAttackAI(ai, c) && doesSpecifiedCreatureAttackAI(ai, pumped)) {'
          new='if (!doesCreatureAttackAI(ai, c) && pumpedWouldAttack.getAsBoolean()) {'
          assert s.count(old)==1, 'Unexpected Forge pump heuristic revision'
          s=s.replace(old,new)
          anchor='        List<Card> oppCreatures = opp.getCreaturesInPlay();'
          assert s.count(anchor)==1
          memo='''        // Cache only within this invocation, never across changing game states.
                  final java.util.function.BooleanSupplier pumpedWouldAttack = new java.util.function.BooleanSupplier() {
                      private Boolean answer;
                      @Override public boolean getAsBoolean() {
                          if (answer == null) {
                              answer = doesSpecifiedCreatureAttackAI(ai, pumped);
                          }
                          return answer;
                      }
                  };
          '''
          s=s.replace(anchor,memo+anchor)
          haste='if (doesSpecifiedCreatureAttackAI(ai, pumped)) {'
          assert s.count(haste)==1
          s=s.replace(haste,'if (pumpedWouldAttack.getAsBoolean()) {')
          p.write_text(s)
          print('Bound expensive speculative attacker evaluation for pump spells on crowded boards')
          PY
      - name: Profile expensive hypothetical combat prediction calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('forge/forge-ai/src/main/java/forge/ai/ComputerUtilCard.java')
          s=p.read_text()
          old='''        AiAttackController aiAtk = new AiAttackController(ai, card);
                  Combat combat = new Combat(ai);
                  aiAtk.declareAttackers(combat);'''
          new='''        final long predictionStarted = System.nanoTime();
                  AiAttackController aiAtk = new AiAttackController(ai, card);
                  Combat combat = new Combat(ai);
                  aiAtk.declareAttackers(combat);
                  final long predictionMillis = (System.nanoTime() - predictionStarted) / 1000000L;
                  if (predictionMillis >= 250L) {
                      System.err.println("FORGE_COMBAT_PROFILE method=doesSpecifiedCreatureAttackAI elapsed_ms="
                              + predictionMillis + " player=" + ai.getName() + " card=" + card.getName());
                  }'''
          assert s.count(old)==1, 'Pinned Forge prediction method changed'
          p.write_text(s.replace(old,new))
          print('Instrumented slow hypothetical combat calls (250ms threshold)')
          PY
      # Diagnostic run #126: iterative chump blocker traversal; preserve all heuristic decisions.
      - name: Instrument per-decision AI evaluation boundaries
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/forge/ForgeDecisionProfile.java forge/forge-ai/src/main/java/forge/ai/ForgeDecisionProfile.java
          python3 scripts/patch_forge_lathiel_counter_pilot.py forge/forge-ai/src/main/java/forge/ai/ability/CountersPutAi.java
          python3 scripts/patch_forge_decision_profile.py forge/forge-ai/src/main/java/forge/ai/AiController.java
      - name: Bound speculative counterattack evaluation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_forge_speculative_combat_guard.py forge/forge-ai/src/main/java/forge/ai/AiAttackController.java
          python3 scripts/patch_forge_counterattack_profile.py forge/forge-ai/src/main/java/forge/ai/AiAttackController.java
          python3 scripts/patch_forge_lazy_speculative_combat.py forge/forge-ai/src/main/java/forge/ai/ComputerUtil.java
          python3 scripts/patch_forge_speculative_block_profile.py forge/forge-ai/src/main/java/forge/ai/ComputerUtil.java
          python3 scripts/patch_forge_destroy_blocker_profile.py forge/forge-ai/src/main/java/forge/ai/ComputerUtilCombat.java
          python3 scripts/patch_forge_replacement_profile.py forge/forge-ai/src/main/java/forge/ai/ComputerUtilCombat.java
          python3 scripts/patch_forge_iterative_chump_blocks.py forge/forge-ai/src/main/java/forge/ai/AiBlockController.java
          echo 'Iterative chump blocker patch newline fix applied; proceeding to compile and five-game validation'
      - name: Instrument nested blocker search and aggregate all calls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_forge_block_aggregate.py forge/forge-ai/src/main/java/forge/ai/AiBlockController.java
      - name: Integrate authoritative Rionya gameplay telemetry into Forge
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/forge/RionyaTelemetry.java forge/forge-game/src/main/java/forge/game/RionyaTelemetry.java
          python3 scripts/patch_forge_rionya_telemetry.py forge/forge-game/src/main/java/forge/game/Game.java
          grep -Fq 'new RionyaTelemetry(this)' forge/forge-game/src/main/java/forge/game/Game.java
          grep -Fq 'RIONYA_EVENT|type=' forge/forge-game/src/main/java/forge/game/RionyaTelemetry.java
      - name: Integrate Rionya commander-first pilot into Forge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_forge_rionya_pilot.py forge/forge-ai/src/main/java/forge/ai/AiController.java
          python3 scripts/patch_forge_rionya_copy.py forge/forge-ai/src/main/java/forge/ai/ability/CopyPermanentAi.java
          grep -q 'RIONYA_PILOT copy_target' forge/forge-ai/src/main/java/forge/ai/ability/CopyPermanentAi.java
          grep -q 'RIONYA_PILOT commander_cast_priority' forge/forge-ai/src/main/java/forge/ai/AiController.java
      - name: Restore reusable compiled Forge and Lab build
        id: compiled
        uses: actions/cache@v4
        with:
          path: |
            forge/forge-gui-desktop/target
            forge/forge-ai/target
            lab/target
            ~/.m2/repository
          key: ${{ runner.os }}-compiled-forge-lab-v1-${{ hashFiles('.github/workflows/commander-ai-lab-build.yml', 'forge-overrides/**', 'scripts/forge/**', 'scripts/patch_forge_*.py', 'scripts/backport_forge_*.py') }}
      - name: Install opt-in deterministic replay seed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_forge_replay_seed.py forge/forge-core/src/main/java/forge/util/MyRandom.java lab/src/main/java/commanderailab/batch/BatchRunner.java
          grep -Fq 'FORGE_REPLAY_SEED=' forge/forge-core/src/main/java/forge/util/MyRandom.java
          grep -Fq 'FORGE_LAB_REPLAY_SEED' lab/src/main/java/commanderailab/batch/BatchRunner.java
      - name: Backport upstream Forge property-check performance fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/backport_forge_pr11933.py forge/forge-game/src/main/java/forge/game/card/CardProperty.java
          python3 scripts/backport_forge_pr11964.py forge/forge-game/src/main/java/forge/game/card/CardState.java
          grep -Fq 'CardType.isACardType(property)' forge/forge-game/src/main/java/forge/game/card/CardProperty.java
      - name: Build Forge dependencies
        if: steps.compiled.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd forge
          mvn -B -ntp install -pl forge-gui-desktop -am -DskipTests -Drevision=2.0.12-SNAPSHOT 2>&1 | tee ../forge-build.log
      - name: Repair installed Forge parent POM version
        if: steps.compiled.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path.home()/'.m2/repository/forge'
          fixed=[]
          for pom in root.rglob('*.pom'):
              source=pom.read_text()
              if '${revision}' in source:
                  pom.write_text(source.replace('${revision}', '2.0.12-SNAPSHOT'))
                  fixed.append(str(pom))
          print('Repaired Forge POM descriptors:', len(fixed))
          for item in fixed: print(item)
          PY
      - name: Build Commander AI Lab
        if: steps.compiled.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd lab
          mvn -B -ntp -DskipTests -Drevision=2.0.12-SNAPSHOT package 2>&1 | tee ../lab-build.log
      - name: Preserve compiled binaries before gameplay
        uses: actions/cache/save@v4
        if: steps.compiled.outputs.cache-hit != 'true'
        with:
          path: |
            forge/forge-gui-desktop/target
            forge/forge-ai/target
            lab/target
            ~/.m2/repository
          key: ${{ runner.os }}-compiled-forge-lab-v1-${{ hashFiles('.github/workflows/commander-ai-lab-build.yml', 'forge-overrides/**', 'scripts/patch_forge_*.py', 'scripts/backport_forge_*.py') }}
      - name: Verify Forge desktop artifact exists
        shell: bash
        run: |
          set -euo pipefail
          find forge/forge-gui-desktop/target -name '*jar-with-dependencies.jar' -print | tee forge-artifacts.log
          test -s forge-artifacts.log
      - name: Verify Rionya pilot bytecode is in runtime Forge JAR
        shell: bash
        run: |
          set -euo pipefail
          FORGE_JAR="$(find forge/forge-gui-desktop/target -name '*jar-with-dependencies.jar' -print -quit)"
          test -n "$FORGE_JAR"
          for class in forge/ai/AiController.class forge/ai/ability/CopyPermanentAi.class; do
            unzip -p "$FORGE_JAR" "$class" | strings | grep -q 'RIONYA_PILOT' || {
              echo "::error::Missing Rionya pilot instrumentation in $class; refusing to run a misleading game"
              exit 1
            }
          done
          echo "Verified custom Rionya pilot bytecode in Forge runtime JAR"
      - name: Verify CLI startup
        shell: bash
        run: |
          set -euo pipefail
          java -jar lab/target/commander-ai-lab-1.0.0-SNAPSHOT.jar --help 2>&1 | tee cli-help.log
      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
      - name: Probe Forge directly before Lab
        shell: bash
        run: |
          set -uo pipefail
          FORGE_JAR="$(realpath "$(find forge/forge-gui-desktop/target -name '*jar-with-dependencies.jar' -print -quit)")"
          echo "Java: $JAVA_HOME"
          echo "Forge jar: $FORGE_JAR"
          ls -ld forge/forge-gui/res forge/forge-gui 2>&1 || true
          unzip -p "$FORGE_JAR" META-INF/MANIFEST.MF | grep -E '^(Main-Class|Manifest-Version):'
          echo '=== Direct Forge CLI ==='
          rc=0
          timeout 30 xvfb-run -a "$JAVA_HOME/bin/java" -jar "$FORGE_JAR" --help > direct-forge.log 2>&1 || rc=$?
          echo "Direct Forge exit: $rc"
          cat direct-forge.log
          echo '=== JVM crash reports ==='
          find . -name 'hs_err_pid*.log' -print
          exit 0
      - name: Install Commander decks in Forge user library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.forge/decks/commander"
          cp "$PRIMARY_DECK" "$SEAT_2_PATH" "$SEAT_3_PATH" "$SEAT_4_PATH" "$HOME/.forge/decks/commander/"
          for deck in "$PRIMARY_DECK" "$SEAT_2_PATH" "$SEAT_3_PATH" "$SEAT_4_PATH"; do
            installed="$HOME/.forge/decks/commander/$(basename "$deck")"
            test -s "$installed" || { echo "::error::Missing installed Forge deck: $installed"; exit 1; }
            cmp "$deck" "$installed" || { echo "::error::Installed Forge deck differs: $deck"; exit 1; }
            echo "Verified Forge Commander deck: $installed"
          done
          ls -l "$HOME/.forge/decks/commander/"
      - name: Install JVM diagnostics tools
        shell: bash
        run: |
          command -v jcmd
          command -v jstack
      - name: Run single diagnostic Forge game
        shell: bash
        timeout-minutes: 115
        run: |
          set -euo pipefail
          mkdir -p results diagnostics
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          files = {
              'workflow': Path('.github/workflows/commander-ai-lab-build.yml'),
              'validator': Path('scripts/validate_forge_game.py'),
                            'deck_primary': Path(os.environ['PRIMARY_DECK']),
              'deck_seat_2': Path(os.environ['SEAT_2_PATH']),
              'deck_seat_3': Path(os.environ['SEAT_3_PATH']),
              'deck_seat_4': Path(os.environ['SEAT_4_PATH']),
          }
          manifest = {'schema_version': 1, 'runtime_pilot_integrated': False,
                      'forge_commit': Path('vendor/forge-metadata/upstream-commit.txt').read_text().strip(),
                      'lab_commit': subprocess.check_output(['git','-C','lab','rev-parse','HEAD'],text=True).strip(),
                      'harness_commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                      'sha256': {k: hashlib.sha256(v.read_bytes()).hexdigest() for k,v in files.items()}}
          Path('results/version-manifest.json').write_text(json.dumps(manifest,indent=2)+'\\n')
          print('Saved exact source and deck version manifest')
          PY
          FORGE_JAR="$(realpath "$(find forge/forge-gui-desktop/target -name '*jar-with-dependencies.jar' -print -quit)")"
          failed=0
          # Three independent attempts per game; preserve every failed attempt and continue the series.
          for ((game=1; game<=GAME_COUNT; game++)); do
            echo "::group::Game $game / $GAME_COUNT"
            game_passed=0
            for attempt in 1 2 3; do
            mkdir -p "results/game-$game/attempt-$attempt" "diagnostics/game-$game/attempt-$attempt"
            echo "Game $game attempt $attempt/3"
            echo "Starting game $game at $(date -u +%FT%TZ)"
            # Fresh true RNG by default; set SEED_BASE to replay fixed seeds.
            FORGE_LAB_REPLAY_SEED="$(python3 scripts/prepare_commander_game.py --game "$game")"
            export FORGE_LAB_REPLAY_SEED
            echo "FORGE_REPLAY_SEED_REQUESTED=$FORGE_LAB_REPLAY_SEED"
            echo "FORGE_REPLAY_MODE=$([ -n "${SEED_BASE:-}" ] && echo fixed || echo random)"
            rm -f forge/forge-sim-debug.log results/diagnostic-game.json smoke-test.log results/validation-report.json
            JAVA_TOOL_OPTIONS="-Dforge.ai.lathielCounterPilot=false -Dforge.ai.rionyaCommanderFirst=true -Dforge.ai.rionyaTelemetry=true" timeout 900 xvfb-run -a java -jar lab/target/commander-ai-lab-1.0.0-SNAPSHOT.jar \
              --forge-jar "$FORGE_JAR" \
              --java17 "${JAVA_HOME}/bin/java" \
              --forge-dir forge/forge-gui \
              --deck1 "$GITHUB_WORKSPACE/$PRIMARY_DECK" \
              --deck2 "$GITHUB_WORKSPACE/$SEAT_2_PATH" \
              --deck3 "$GITHUB_WORKSPACE/$SEAT_3_PATH" \
              --deck4 "$GITHUB_WORKSPACE/$SEAT_4_PATH" \
              --games 1 --threads 1 --clock 600 --no-db \
              --output "results/game-$game/attempt-$attempt/diagnostic-game.json" --verbose > "results/game-$game/attempt-$attempt/smoke-test.log" 2>&1 &
            supervisor=$!
            # Observation-only watchdog; records turn/action progress without terminating Forge.
            python3 scripts/game_progress_watchdog.py \
              --log "forge/forge-sim-debug.log" \
              --fallback-log "results/game-$game/attempt-$attempt/smoke-test.log" \
              --output "diagnostics/game-$game/attempt-$attempt/progress-watchdog.json" \
              --interval 30 --stale-seconds 300 --max-seconds 900 \
              --supervisor-pid "$supervisor" --terminate-on-stall --stall-confirmations 2 &
            watchdog=$!
            for sample in $(seq 1 26); do
              # Wake promptly when the game ends rather than delaying up to 60 seconds.
              for ((tick=0; tick<30; tick++)); do
                if ! kill -0 "$supervisor" 2>/dev/null; then break; fi
                sleep 1
              done
              if ! kill -0 "$supervisor" 2>/dev/null; then break; fi
              echo "GAME_HEARTBEAT game=$game attempt=$attempt sample=$sample utc=$(date -u +%FT%TZ) supervisor_pid=$supervisor"
              # Publish progress in the live Actions log, which remains readable in the web UI.
              python3 - "diagnostics/game-$game/attempt-$attempt/progress-watchdog.json" <<'PYPROGRESS'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if p.exists():
              samples=json.loads(p.read_text()).get("samples",[])
              if samples:
                  x=samples[-1]
                  print("FORGE_PROGRESS turn={last_turn} turns_seen={turn_markers} actions={action_markers} stale_seconds={stale_seconds} possible_stall={possible_stall} terminal={terminal_result}".format(**x),flush=True)
          else:
              print("FORGE_PROGRESS awaiting first watchdog sample",flush=True)
          PYPROGRESS
              pgrep -af java > "diagnostics/game-$game/attempt-$attempt/process-$sample.txt" || true
              pids="$(ps -eo pid=,args= | awk '/[j]ava/ && /forge-gui-desktop|jar-with-dependencies/ && !/commander-ai-lab/ {print $1}')"
              for pid in $pids; do
                ps -p "$pid" -o pid,ppid,lstart,etime,args >> "diagnostics/game-$game/attempt-$attempt/process-$sample.txt" || true
                if [ ! -f "diagnostics/game-$game/attempt-$attempt/profile-started-$pid" ]; then
                  if timeout 15 jcmd "$pid" JFR.start name=forge_profile settings=profile "filename=$GITHUB_WORKSPACE/diagnostics/game-$game/attempt-$attempt/profile-$pid.jfr" dumponexit=true maxsize=32m > "diagnostics/game-$game/attempt-$attempt/profile-start-$pid.log" 2>&1; then
                    touch "diagnostics/game-$game/attempt-$attempt/profile-started-$pid"
                  fi
                fi
                timeout 15 jcmd "$pid" Thread.print -l > "diagnostics/game-$game/attempt-$attempt/thread-$sample-$pid.txt" 2>&1 || timeout 15 jstack -l "$pid" > "diagnostics/game-$game/attempt-$attempt/jstack-$sample-$pid.txt" 2>&1 || true
              done
              wc -c "results/game-$game/attempt-$attempt/smoke-test.log" > "diagnostics/game-$game/attempt-$attempt/log-bytes-$sample.txt" || true
            done
            rc=0
            wait "$supervisor" || rc=$?
            # Stop only the observer once the actual game process has exited.
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            echo "Lab exit code: $rc"
            cp forge/forge-sim-debug.log "results/game-$game/attempt-$attempt/forge-sim-debug.log" 2>/dev/null || true
            tail -n 30 "results/game-$game/attempt-$attempt/smoke-test.log" || true
            attempt_failed=0
            if [ "$rc" -ne 0 ]; then attempt_failed=1; fi
            # Validator expects root-level Lab and Forge logs; stage only this game's logs.
            cp "results/game-$game/attempt-$attempt/smoke-test.log" smoke-test.log
            cp "results/game-$game/attempt-$attempt/diagnostic-game.json" results/diagnostic-game.json 2>/dev/null || true
            cp "results/game-$game/attempt-$attempt/forge-sim-debug.log" forge/forge-sim-debug.log 2>/dev/null || true
            if python3 scripts/validate_forge_game.py; then
              echo "Game $game: strict validation passed"
            else
              echo "Game $game: strict validation FAILED"
              attempt_failed=1
            fi
            cp results/validation-report.json "results/game-$game/attempt-$attempt/validation-report.json" 2>/dev/null || true
            # Reconcile the final Forge log even if the observer exited between samples.
            python3 - "$game" "$attempt" <<'PYFINAL'
          import json,sys
          from pathlib import Path
          from scripts.game_progress_watchdog import progress_markers
          game,attempt=sys.argv[1:3]
          log=Path(f"results/game-{game}/attempt-{attempt}/forge-sim-debug.log")
          markers=progress_markers(log.read_text(errors="replace")) if log.exists() else {}
          report=Path(f"results/game-{game}/attempt-{attempt}/validation-report.json")
          validation=json.loads(report.read_text()) if report.exists() else {}
          summary={"game":int(game),"attempt":int(attempt),"progress":markers,"validation":validation}
          out=Path(f"results/game-{game}/attempt-{attempt}/game-summary.json")
          out.write_text(json.dumps(summary,indent=2,default=str)+"\\n")
          print(f"GAME_SUMMARY game={game} attempt={attempt} final_turn={markers.get('last_turn')} actions={markers.get('action_markers')} terminal={markers.get('terminal_result')} validation={validation.get('classification')} startup_timeouts={validation.get('startup_ai_decision_timeouts')} in_game_timeouts={validation.get('in_game_ai_decision_timeouts')}",flush=True)
          PYFINAL
            if [ "$attempt_failed" -eq 0 ]; then
              game_passed=1
              echo "GAME_ATTEMPT game=$game attempt=$attempt status=VALID"
              break
            fi
            echo "::warning::GAME_ATTEMPT game=$game attempt=$attempt status=INVALID; preserving diagnostics"
            done
            if [ "$game_passed" -eq 0 ]; then
              echo "::warning::Game $game invalid after 3 attempts; skipping to next game"
              failed=1
            fi
            echo "::endgroup::"
          done
          echo "Configurable Commander series attempted; invalid results fail closed."
          if [ "$failed" -eq 0 ]; then echo "Configured Commander series validated"; fi
          exit "$failed"
      - name: Audit Rionya cards and pilot decisions
        if: always()
        shell: bash
        run: |
          set +e
          python3 scripts/audit_rionya_gameplay.py --results results
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Card audit failed (exit $code); gameplay validation remains authoritative"
            mkdir -p results
            printf '{"audit_status":"failed","exit_code":%s}\n' "$code" > results/card-audit-status.json
          else
            python3 - <<'PYTELEMETRY'
          import json
          from pathlib import Path
          p=Path("results/card-audit-index.json")
          data=json.loads(p.read_text()) if p.exists() else {}
          games=data.get("summaries",[])
          complete=bool(games) and all(g.get("telemetry_quality",{}).get("complete_for_card_cut_recommendations") for g in games)
          status={"audit_status":"complete" if complete else "incomplete",
                  "games_audited":len(games),
                  "deck_recommendations_allowed":complete,
                  "reason":None if complete else "Exact draws, mulligans, mana payments or other authoritative events are not fully captured"}
          Path("results/card-audit-status.json").write_text(json.dumps(status,indent=2)+"\\n")
          print("TELEMETRY_GATE",json.dumps(status),flush=True)
          PYTELEMETRY
          fi
          exit 0
      - name: Publish run outcome in dashboard issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/2/comments" -f body="RUN_BUILD_STEP_FINISHED run_id=$GITHUB_RUN_ID sha=$GITHUB_SHA job_status=${{ job.status }} url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || echo "::warning::Run dashboard outcome comment could not be posted"
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rionya-five-game-evidence
          path: |
            forge-build.log
            lab-build.log
            cli-help.log
            forge-artifacts.log
            smoke-test.log
            direct-forge.log
            forge/forge-sim-debug.log
            results/**
            diagnostics/**
            lab/target/*.jar
          if-no-files-found: warn
          retention-days: 14
